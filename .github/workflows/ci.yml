name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  backend-tests:
    name: 后端单元测试
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: zwx_agent
          POSTGRES_USER: zwx_agent
          POSTGRES_PASSWORD: zwx_agent_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zwx_agent -d zwx_agent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/zwx_agent
      SPRING_DATASOURCE_USERNAME: zwx_agent
      SPRING_DATASOURCE_PASSWORD: zwx_agent_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: mvn test
        run: mvn -B -ntp test

  frontend-build:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        working-directory: frontend
        run: npm ci
      - name: npm run build
        working-directory: frontend
        run: npm run build

  intent-eval-gate:
    name: 意图评测门禁
    runs-on: ubuntu-latest
    env:
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: run intent gate
        run: python3 evaluation/eval-sets/run_intent_gate.py evaluation/eval-sets/ci-intent-result.json
      - name: upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intent-eval-result
          path: evaluation/eval-sets/ci-intent-result.json
          if-no-files-found: ignore
