name: aster

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    mem_limit: 1g
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  image-mcp:
    image: aster-image-mcp:${IMAGE_TAG}
    restart: unless-stopped
    mem_limit: 512m
    environment:
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      DASHSCOPE_VISION_MODEL: ${DASHSCOPE_VISION_MODEL:-qwen3-vl-plus}
      IMAGE_ALLOWED_HOSTS: ${IMAGE_ALLOWED_HOSTS:-*.aliyuncs.com}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8127/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  document-mcp:
    image: aster-document-mcp:${IMAGE_TAG}
    restart: unless-stopped
    mem_limit: 512m
    environment:
      DOCUMENT_PROVIDER: ${DOCUMENT_PROVIDER:-mineru}
      DOCUMENT_FALLBACK_TO_DOCLING: ${DOCUMENT_FALLBACK_TO_DOCLING:-false}
      MINERU_TOKEN: ${MINERU_TOKEN:-}
      MINERU_MODEL_VERSION: ${MINERU_MODEL_VERSION:-vlm}
      MINERU_LANGUAGE: ${MINERU_LANGUAGE:-ch}
      MINERU_TIMEOUT_SECONDS: ${MINERU_TIMEOUT_SECONDS:-600}
      DOCLING_ENABLED: "false"
      TIKA_BASE_URL: ${TIKA_BASE_URL:-}
      DOCUMENT_ALLOWED_HOSTS: ${DOCUMENT_ALLOWED_HOSTS:-*.aliyuncs.com}
      DOCUMENT_MAX_BYTES: ${DOCUMENT_MAX_BYTES:-20971520}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8128/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  browser-mcp:
    profiles: ["browser"]
    image: aster-browser-mcp:${IMAGE_TAG}
    restart: unless-stopped
    mem_limit: 1536m
    environment:
      PORT: 8129
      SCREENSHOT_DIR: /app/screenshots
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:${ASTER_PORT:-8080}}
      BROWSER_ALLOW_PRIVATE_HOSTS: "false"
      BROWSER_ALLOWED_HOSTS: ${BROWSER_ALLOWED_HOSTS:-*}
      SCREENSHOT_TTL_MS: ${SCREENSHOT_TTL_MS:-1800000}
    volumes:
      - screenshots:/app/screenshots
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8129/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    image: aster-backend:${IMAGE_TAG}
    restart: unless-stopped
    mem_limit: 1536m
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_SQL_INIT_MODE: always
      SPRING_AI_DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      SEARCH_API_API_KEY: ${SEARCH_API_API_KEY:-}
      ALIYUN_OSS_ENDPOINT: ${ALIYUN_OSS_ENDPOINT:-}
      ALIYUN_OSS_BUCKET: ${ALIYUN_OSS_BUCKET:-}
      ALIYUN_OSS_ACCESS_KEY_ID: ${ALIYUN_OSS_ACCESS_KEY_ID:-}
      ALIYUN_OSS_ACCESS_KEY_SECRET: ${ALIYUN_OSS_ACCESS_KEY_SECRET:-}
      APP_TIKA_BASE_URL: ${APP_TIKA_BASE_URL:-}
      APP_DOCUMENT_PARSER_PROVIDER: ${APP_DOCUMENT_PARSER_PROVIDER:-mineru}
      APP_DOCUMENT_PARSER_DOCLING_ENABLED: ${APP_DOCUMENT_PARSER_DOCLING_ENABLED:-false}
      MINERU_TOKEN: ${MINERU_TOKEN:-}
      APP_MCP_ALLOW_PRIVATE_ENDPOINTS: "true"
      APP_TEMP_DIR: /app/temp
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./temp:/app/temp
      - ${APP_GLOBE_CONF:-/home/globe.conf}:/home/globe.conf:ro
    # 管理端口 8124（health/metrics/prometheus）只在 compose 网络内暴露，供 Prometheus 抓取
    expose:
      - "8124"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8124/actuator/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  frontend:
    image: aster-frontend:${IMAGE_TAG}
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      - backend
    ports:
      - "${ASTER_PORT:-8080}:80"

  # 监控栈（可选）：docker compose --profile monitoring up -d prometheus grafana
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    mem_limit: 512m
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"

volumes:
  postgres-data:
  screenshots:
  prometheus-data:
  grafana-data:
