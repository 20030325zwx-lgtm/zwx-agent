name: aster

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    mem_limit: 2g
    # 参数按 8 核/8G 云盘调优（2026-11-05）：默认 shared_buffers=128MB、random_page_cost=4 对 SSD 偏保守。
    # pg_stat_statements 需要预加载，用于后续按真实耗时定位慢查询。
    command:
      - postgres
      - -c
      - shared_buffers=768MB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - effective_cache_size=3GB
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.max=5000
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # 仅绑定回环：本机 SSH 隧道（开发库 15432→5432）与运维 pg_dump 使用；
    # 不经过公网（安全组只开放 SSH/80/443）。
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  image-mcp:
    image: aster-image-mcp:${IMAGE_TAG}
    restart: unless-stopped
    mem_limit: 512m
    environment:
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
      DASHSCOPE_VISION_MODEL: ${DASHSCOPE_VISION_MODEL:-qwen3-vl-plus}
      IMAGE_ALLOWED_HOSTS: ${IMAGE_ALLOWED_HOSTS:-*.aliyuncs.com}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8127/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  document-mcp:
    image: aster-document-mcp:${IMAGE_TAG}
    restart: unless-stopped
    mem_limit: 512m
    environment:
      DOCUMENT_PROVIDER: ${DOCUMENT_PROVIDER:-mineru}
      DOCUMENT_FALLBACK_TO_DOCLING: ${DOCUMENT_FALLBACK_TO_DOCLING:-false}
      MINERU_TOKEN: ${MINERU_TOKEN:-}
      MINERU_MODEL_VERSION: ${MINERU_MODEL_VERSION:-vlm}
      MINERU_LANGUAGE: ${MINERU_LANGUAGE:-ch}
      MINERU_TIMEOUT_SECONDS: ${MINERU_TIMEOUT_SECONDS:-600}
      DOCLING_ENABLED: "false"
      TIKA_BASE_URL: ${TIKA_BASE_URL:-}
      DOCUMENT_ALLOWED_HOSTS: ${DOCUMENT_ALLOWED_HOSTS:-*.aliyuncs.com}
      DOCUMENT_MAX_BYTES: ${DOCUMENT_MAX_BYTES:-20971520}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8128/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  browser-mcp:
    profiles: ["browser"]
    image: aster-browser-mcp:${IMAGE_TAG}
    restart: unless-stopped
    mem_limit: 1536m
    environment:
      PORT: 8129
      SCREENSHOT_DIR: /app/screenshots
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:${ASTER_PORT:-8080}}
      BROWSER_ALLOW_PRIVATE_HOSTS: "false"
      BROWSER_ALLOWED_HOSTS: ${BROWSER_ALLOWED_HOSTS:-*}
      SCREENSHOT_TTL_MS: ${SCREENSHOT_TTL_MS:-1800000}
    volumes:
      - screenshots:/app/screenshots
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8129/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    image: aster-backend:${IMAGE_TAG}
    restart: unless-stopped
    mem_limit: 1536m
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_SQL_INIT_MODE: always
      SPRING_AI_DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      SEARCH_API_API_KEY: ${SEARCH_API_API_KEY:-}
      ALIYUN_OSS_ENDPOINT: ${ALIYUN_OSS_ENDPOINT:-}
      ALIYUN_OSS_BUCKET: ${ALIYUN_OSS_BUCKET:-}
      ALIYUN_OSS_ACCESS_KEY_ID: ${ALIYUN_OSS_ACCESS_KEY_ID:-}
      ALIYUN_OSS_ACCESS_KEY_SECRET: ${ALIYUN_OSS_ACCESS_KEY_SECRET:-}
      # 对象存储（2026-11-05）：s3=服务器自建 MinIO；oss=阿里云（可只做历史对象只读兜底）
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-oss}
      STORAGE_FALLBACK_PROVIDER: ${STORAGE_FALLBACK_PROVIDER:-}
      STORAGE_MIGRATE: ${STORAGE_MIGRATE:-false}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_BUCKET: ${MINIO_BUCKET:-aster-media}
      APP_TIKA_BASE_URL: ${APP_TIKA_BASE_URL:-}
      APP_DOCUMENT_PARSER_PROVIDER: ${APP_DOCUMENT_PARSER_PROVIDER:-mineru}
      APP_DOCUMENT_PARSER_DOCLING_ENABLED: ${APP_DOCUMENT_PARSER_DOCLING_ENABLED:-false}
      MINERU_TOKEN: ${MINERU_TOKEN:-}
      APP_MCP_ALLOW_PRIVATE_ENDPOINTS: "true"
      APP_TEMP_DIR: /app/temp
      APP_PROJECT_WORKSPACE_ROOT: /app/projects
      # 服务间内部接口令牌（/api/internal/**）：与 eval-service/data-service 一致
      PLATFORM_INTERNAL_TOKEN: ${PLATFORM_INTERNAL_TOKEN}
      # artifact 排版引擎（docx/pptx/Markdown-PDF）；留空 = 不注册对应工具
      APP_ARTIFACT_BASE_URL: ${APP_ARTIFACT_BASE_URL:-}
      APP_ARTIFACT_TOKEN: ${ARTIFACT_INTERNAL_TOKEN:-}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./temp:/app/temp
      - ${ASTER_PROJECTS_HOST_ROOT:-./projects}:/app/projects
      - ${APP_GLOBE_CONF:-/home/globe.conf}:/home/globe.conf:ro
    # 管理端口 8135（health/metrics/prometheus）只在 compose 网络内暴露，供 Prometheus 抓取
    expose:
      - "8135"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8135/actuator/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  frontend:
    image: aster-frontend:${IMAGE_TAG}
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      - backend
    ports:
      - "${ASTER_PORT:-8080}:80"

  # ---------------------------------------------------------------------------
  # artifact 排版引擎（可选）：docx / pptx / Markdown-PDF 渲染 + LibreOffice 格式转换。
  # 只在启用时启动：docker compose --profile artifacts up -d artifact-mcp
  # backend 侧需同时设置 .env 的 APP_ARTIFACT_BASE_URL=http://artifact-mcp:8130（否则不注册相关工具）。
  # 镜像内含 LibreOffice 与 Noto CJK，体积约 800MB+，按需启用。
  # ---------------------------------------------------------------------------
  artifact-mcp:
    profiles: ["artifacts"]
    image: aster-artifact-mcp:${IMAGE_TAG}
    restart: unless-stopped
    mem_limit: 1024m
    environment:
      ARTIFACT_INTERNAL_TOKEN: ${ARTIFACT_INTERNAL_TOKEN:-}
      ARTIFACT_TIMEOUT_SECONDS: ${ARTIFACT_TIMEOUT_SECONDS:-120}
      TZ: ${TZ:-Asia/Shanghai}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8130/internal/render/capabilities >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # 独立中台服务（各自独立镜像、独立页面；与主站共用 PostgreSQL 的 platform schema）：
  #   eval-service 评测中台：/eval/ 页面 + /api/ai/eval/**；执行经主站内部 API
  #   data-service 数据中台：/data/ 页面 + /api/ai/feedback/**；回流调 eval-service
  # 服务间通过 X-Aster-Internal-Token（PLATFORM_INTERNAL_TOKEN）鉴权。
  # ---------------------------------------------------------------------------
  eval-service:
    image: aster-eval-service:${IMAGE_TAG}
    restart: unless-stopped
    mem_limit: 1024m
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:-}
      PLATFORM_INTERNAL_TOKEN: ${PLATFORM_INTERNAL_TOKEN}
      # CI 只读门禁令牌（留空则禁用）
      PLATFORM_CI_TOKEN: ${PLATFORM_CI_TOKEN:-}
      PLATFORM_CI_TENANT: ${PLATFORM_CI_TENANT:-default}
      ASTER_BACKEND_URL: http://backend:8123
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      EVAL_MODEL: ${EVAL_MODEL:-qwen-plus}
      EVAL_SCHEDULER_ENABLED: "true"
      EVAL_TASK_TIMEOUT_MINUTES: ${EVAL_TASK_TIMEOUT_MINUTES:-15}
      TZ: ${TZ:-Asia/Shanghai}
    expose:
      - "8140"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8140/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  data-service:
    image: aster-data-service:${IMAGE_TAG}
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
      eval-service:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:-}
      PLATFORM_INTERNAL_TOKEN: ${PLATFORM_INTERNAL_TOKEN}
      ASTER_EVAL_URL: http://eval-service:8140
      TZ: ${TZ:-Asia/Shanghai}
    expose:
      - "8141"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8141/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  # 监控栈（可选）：docker compose --profile monitoring up -d prometheus grafana
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    mem_limit: 512m
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"

volumes:
  postgres-data:
  screenshots:
  prometheus-data:
  grafana-data:
