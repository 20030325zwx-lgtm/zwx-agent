#aster-home #aw-toast{position:absolute;left:24px;right:24px;bottom:18px;z-index:8;padding:12px 15px;background:var(--aw-ink);color:var(--aw-bg);font-size:12px;border-radius:9px;box-shadow:0 5px 25px #0002}#aster-home dialog{color:var(--aw-ink);background:var(--aw-panel);border:1px solid var(--aw-line);border-radius:14px;padding:23px;width:min(480px,calc(100% - 32px));box-shadow:0 20px 70px #0003}#aster-home dialog::backdrop{background:#11182755;backdrop-filter:blur(3px)}#aster-home .aw-dialog-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:19px}#aster-home .aw-dialog-head h2{font-size:16px}#aster-home .aw-dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}#aster-home .aw-dialog-hint{font-size:11px;color:var(--aw-muted);line-height:1.7}#aster-home .aw-search-input{width:100%;padding:11px;border:1px solid var(--aw-line);border-radius:8px;background:var(--aw-bg);margin-bottom:12px}#aster-home .aw-app.aw-side-hidden{grid-template-columns:minmax(0,1fr)}#aster-home .aw-app.aw-side-hidden .aw-side{display:none}
@media(max-width:950px){#aster-home .aw-home-lower{grid-template-columns:minmax(0,1fr) 185px;gap:18px}#aster-home #aw-main{padding:23px}#aster-home .aw-project-card{padding:12px}#aster-home .aw-project-card p{min-height:30px}#aster-home .aw-two-panels{grid-template-columns:minmax(0,1fr)}#aster-home .aw-ai{display:grid;grid-template-columns:1fr 1fr;gap:6px 15px}#aster-home .aw-ai h3,#aster-home .aw-ai .aw-context,#aster-home #aw-ai-response{grid-column:1/-1}#aster-home .aw-ai p{margin:0}#aster-home .aw-ai .aw-button{margin:0}}

@media(max-width:520px){#aster-home .aw-app{grid-template-columns:minmax(0,1fr);border-radius:8px}#aster-home .aw-side{padding:12px;border-right:0;border-bottom:1px solid var(--aw-line)}#aster-home .aw-brand{padding:0 3px 12px}#aster-home .aw-space,#aster-home .aw-new,#aster-home .aw-side-caption,#aster-home .aw-pinned,#aster-home .aw-side-bottom{display:none}#aster-home .aw-nav{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}#aster-home .aw-nav button{justify-content:center;padding:9px 5px;font-size:11px;gap:6px}#aster-home .aw-nav svg{width:14px}#aster-home .aw-count{display:none}#aster-home #aw-main{padding:19px 15px}#aster-home .aw-top{padding:10px 13px;min-height:50px}#aster-home .aw-breadcrumb{font-size:10px;gap:7px}#aster-home .aw-search kbd{display:none}#aster-home .aw-right-rail{grid-template-columns:minmax(0,1fr)}#aster-home .aw-home-note{align-items:flex-start}#aster-home .aw-ai{display:block}#aster-home .aw-ai .aw-button{margin-top:8px}#aster-home .aw-ai p{margin:12px 0}#aster-home .aw-paper{padding:18px}#aster-home .aw-heading{gap:8px}#aster-home .aw-heading h1{font-size:23px}#aster-home .aw-board{display:flex;flex-direction:column;gap:14px;padding:18px;min-height:0}#aster-home .aw-board-node{position:relative!important;left:auto!important;top:auto!important;width:100%;touch-action:auto;cursor:default}#aster-home .aw-edges{display:none}}
@media(pointer:coarse){#aster-home button{min-height:42px}#aster-home input,#aster-home textarea,#aster-home select{font-size:16px!important}}@media(prefers-reduced-motion:reduce){#aster-home button{transition:none}}
</style>
<script>
(() => {
 const root=document.getElementById('aster-home'), main=root.querySelector('#aw-main'), dialog=root.querySelector('#aw-dialog');
 const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const icon=(name)=>`<i data-lucide="${name}" aria-hidden="true"></i>`;
 const projects=[{id:'research',name:'产品研究',desc:'资料、洞察与研究成果',icon:'compass',count:'6 份资料 · 2 个任务',recent:'竞品分析报告',time:'刚刚'},{id:'dev',name:'Aster 开发',desc:'从需求到可验证的交付',icon:'code-2',count:'4 个任务 · 1 张画布',recent:'工作台改造计划',time:'20 分钟前'},{id:'knowledge',name:'知识库运营',desc:'文档整理与入库审核',icon:'library',count:'3 份文档 · 1 个流程',recent:'文档审核与入库',time:'1 小时前'}];
 const objects=[{id:'report',title:'竞品分析报告',type:'doc',icon:'file-text',project:'research',status:'已生成',tone:'done',time:'刚刚',desc:'文档 · 产品研究'},{id:'plan',title:'工作台改造计划',type:'task',icon:'list-checks',project:'dev',status:'待确认',tone:'wait',time:'20 分钟前',desc:'任务 · Aster 开发'},{id:'board',title:'研究思路与资料',type:'canvas',icon:'layout-dashboard',project:'research',status:'草稿',tone:'draft',time:'45 分钟前',desc:'画布 · 产品研究'},{id:'flow',title:'文档审核与入库',type:'workflow',icon:'workflow',project:'knowledge',status:'待审核',tone:'wait',time:'1 小时前',desc:'工作流 · 知识库运营'}];
 const state={page:'home',filter:'all',project:'research',draft:'',taskProject:'none',appearance:'system',sidebarWidth:196,density:'舒展',homeOrder:'项目优先',provider:'compatible',selectedNode:'',nodes:{},newTasks:[]};
 let toastTimer,resizeObserver;
 const names={home:'工作台',projects:'项目',tasks:'任务',resources:'资源',workflows:'工作流',canvas:'画布',settings:'模型设置',project:'项目',doc:'文档',task:'任务详情',board:'画布',flow:'工作流'};
 function icons(){if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});root.querySelectorAll('button').forEach(b=>b.classList.add('cursor-interaction'));}
 function toast(msg){const el=root.querySelector('#aw-toast');el.textContent=msg;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{el.hidden=true},4200);}
 function heading(title,subtitle,action=''){return `<div class="aw-heading"><div><h1>${title}</h1><p>${subtitle}</p></div>${action}</div>`;}
 const button=(label,act,primary=false)=>`<button type="button" class="aw-button ${primary?'aw-primary':''}" data-act="${act}">${label}</button>`;
 function row(o){return `<button type="button" class="aw-object-row" data-object="${esc(o.id)}"><span class="aw-file-icon">${icon(o.icon)}</span><span class="aw-object-copy"><strong>${esc(o.title)}</strong><small>${esc(o.desc)}</small></span><span class="aw-object-right"><span class="aw-tag is-${o.tone}">${o.status}</span><span>${o.time}</span></span></button>`;}
 function projectCards(){return `<div class="aw-project-grid">${projects.map(p=>`<button type="button" class="aw-project-card" data-project="${p.id}"><div class="aw-project-top"><span class="aw-project-icon">${icon(p.icon)}</span><small>${p.time}</small></div><h3>${esc(p.name)}</h3><p>${esc(p.count)}</p><footer>${icon('corner-down-right')}<span>${esc(p.recent)}</span></footer></button>`).join('')}</div>`;}
 function composer(){return `<section class="aw-composer" aria-label="快速发起任务"><div class="aw-composer-label">${icon('sparkles')}开始一件新工作</div><textarea id="aw-task-input" rows="2" aria-label="描述新任务" placeholder="描述你的目标，或从项目里的资料开始…">${esc(state.draft)}</textarea><div class="aw-composer-footer"><div class="aw-composer-options"><button type="button" class="aw-link" data-act="attach">${icon('paperclip')}添加资料</button><select id="aw-task-project" aria-label="任务归属项目"><option value="none">不关联项目</option>${projects.map(p=>`<option value="${p.id}" ${state.taskProject===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select><button type="button" class="aw-link" data-page="settings">${icon('box')}选择模型</button></div>${button('创建任务 '+icon('arrow-up'),'create-task',true)}</div></section>`;}
 function renderHome(){main.innerHTML=heading('工作台','继续你的项目，或开始一件新工作。','<span class="aw-date">10 月 28 日 · 星期三</span>')+composer()+`<div class="aw-home-sections"><section id="aw-project-section"><div class="aw-section-head"><h2>继续项目</h2><button class="aw-link" type="button" data-page="projects">全部项目 ${icon('arrow-up-right')}</button></div>${projectCards()}</section><div class="aw-home-lower" id="aw-task-section"><section><div class="aw-section-head"><h2>最近工作</h2><button class="aw-link" type="button" data-page="resources">查看全部 ${icon('arrow-up-right')}</button></div><div class="aw-tabbar" aria-label="最近工作筛选"><button type="button" data-filter="all" aria-pressed="${state.filter==='all'}">全部</button><button type="button" data-filter="task" aria-pressed="${state.filter==='task'}">任务</button><button type="button" data-filter="doc" aria-pressed="${state.filter==='doc'}">产物</button></div><div id="aw-recent-list"></div></section><aside class="aw-right-rail"><section class="aw-attention"><div class="aw-attention-head">${icon('circle-dot')}需要你处理 <small>2</small></div><div class="aw-attention-item"><p>确认工作台改造计划</p><small>计划已准备好，等待你审阅。</small><button class="aw-link" type="button" data-object="plan">查看计划 ${icon('arrow-right')}</button></div><div class="aw-attention-item"><p>审核知识库文档</p><small>确认后进入下一步处理。</small><button class="aw-link" type="button" data-object="flow">查看流程 ${icon('arrow-right')}</button></div></section><section class="aw-shortflows"><h2>常用工作流</h2><button class="aw-shortflow" type="button" data-object="flow">${icon('workflow')}<span><strong>文档审核与入库</strong><small>资料 → 解析 → 审核 → 入库</small></span></button><button class="aw-shortflow" type="button" data-act="weekly">${icon('calendar-days')}<span><strong>每周研究简报</strong><small>从资料整理到报告草稿</small></span></button></section></aside></div></div><div class="aw-home-note">${icon('hard-drive')}个人工作区 · 数据保存在本机；模型服务由你配置。</div>`;renderRecent();applyDesign();}
 function renderRecent(){const target=main.querySelector('#aw-recent-list');if(!target)return;const list=[...state.newTasks,...objects].filter(o=>state.filter==='all'||o.type===state.filter);target.innerHTML=list.length?list.slice(0,5).map(row).join(''):'<div class="aw-empty">暂无此类工作</div>';icons();}
 function renderCollection(page){const info={projects:['项目','把相关的任务、资料和成果放在一起。'],tasks:['任务','从计划、执行到交付，随时回到任务现场。'],resources:['资源','文档、文件与画布，独立保存，随时复用。'],workflows:['工作流','把重复的工作整理成可复用流程。'],canvas:['画布','把资料、想法与任务放在同一张画布上。']}[page];main.innerHTML=heading(info[0],info[1],button(icon('plus')+' 新建',page==='projects'?'new-project':page==='tasks'?'new-task':page==='workflows'?'new-flow':page==='canvas'?'new-canvas':'attach'));
 if(page==='projects'){main.innerHTML+=projectCards();return;}let list=[...state.newTasks,...objects].filter(o=>page==='tasks'?o.type==='task':page==='workflows'?o.type==='workflow':page==='canvas'?o.type==='canvas':o.type!=='task');main.innerHTML+=list.map(row).join('');if(page==='workflows')main.innerHTML+='<p class="aw-settings-note">示例流程用于预览设计，尚未连接执行引擎。</p>';}
 function renderProject(){const p=projects.find(p=>p.id===state.project);main.innerHTML=`<div class="aw-project-banner">${heading(esc(p.name),esc(p.desc),button(icon('plus')+' 新建任务','new-task'))}<div class="aw-project-tabs">${button(icon('file-text')+' 文档','open-doc')}${button(icon('layout-dashboard')+' 画布','open-board')}${button(icon('workflow')+' 工作流','open-flow')}</div></div><div class="aw-section-head"><h2>项目中的工作</h2><small>任务与产物保留在同一个地方</small></div>${[...state.newTasks,...objects].filter(o=>o.project===p.id).map(row).join('')||'<div class="aw-empty">项目已创建，开始添加资料或新建任务。</div>'}`;}
 function aiPanel(context){return `<aside class="aw-ai"><h3>${icon('sparkles')}AI 协作</h3><div class="aw-context">当前上下文：${esc(context)}</div><p>围绕当前内容继续工作，引用范围始终可见。</p><button type="button" class="aw-button" data-ai="summary">${icon('align-left')}提炼关键结论</button><button type="button" class="aw-button" data-ai="next">${icon('list-checks')}整理下一步计划</button><div id="aw-ai-response" aria-live="polite"></div></aside>`;}
 function renderDocument(){main.innerHTML=heading('竞品分析报告','产品研究 / 文档 · 示例草稿',button(icon('arrow-left')+' 返回工作台','home'))+`<div class="aw-two-panels"><article class="aw-paper"><small>研究笔记 / 2026.10.28</small><h2>AI 工作台的下一种形态</h2><p>让资料、任务与成果在同一个项目中流转，AI 根据当前工作提供协助。</p><div class="aw-callout">工作台的核心是正在进行的工作：阅读材料时关注内容，编排流程时关注节点，执行任务时关注结果。</div><h3>三个值得保留的设计</h3><ul><li>统一项目上下文，任务与产物可相互追溯。</li><li>中央区域打开文档、画布和流程，不被固定布局限制。</li><li>AI 理解当前选区，给出可检查的操作建议。</li></ul><h3>下一步</h3><p>先验证首页与项目内的使用路径，再逐步补齐工作流集成和内容画布。</p></article>${aiPanel('竞品分析报告')}</div>`;}
 function renderTask(){const t=state.currentTask||objects.find(o=>o.id==='plan');const fresh=t.id.startsWith('draft-');main.innerHTML=heading(esc(t.title),fresh?'任务草稿 · 尚未调用模型':'Aster 开发 / 任务 · 等待确认',button(icon('arrow-left')+' 返回工作台','home'))+`<div class="aw-two-panels"><article class="aw-paper"><span class="aw-tag is-${fresh?'draft':'wait'}">${fresh?'草稿':'待确认'}</span><h3>${fresh?'你的目标':'工作台改造计划'}</h3><p>${esc(fresh?t.title:'先完成工作台框架与模型配置，再逐步加入文档、画布和工作流。')}</p>${fresh?'<div class="aw-callout">任务草稿已创建。正式应用会在模型配置完成后开始规划；当前预览不会执行任务。</div>':'<ol class="aw-task-steps"><li><span>01</span>验证本机运行环境</li><li><span>02</span>统一工作台与项目导航</li><li><span>03</span>接通供应商与模型配置</li><li><span>04</span>验证任务和产物使用流程</li></ol>'}<div class="aw-project-tabs">${button('补充要求','revise')}${button('预览确认状态','approve-preview',true)}</div></article>${aiPanel(t.title)}</div>`;}
 function boardNodes(flow){return flow?[{id:'input',x:6,y:17,kind:'输入',icon:'file-input',title:'接收文档',desc:'用户添加需要处理的资料'},{id:'parse',x:39,y:17,kind:'处理',icon:'text-search',title:'解析与整理',desc:'提取正文并生成结构化内容'},{id:'review',x:68,y:57,kind:'人工确认',icon:'user-check',title:'审核内容',desc:'确认内容后继续后续步骤'},{id:'output',x:27,y:67,kind:'输出',icon:'library',title:'保存到知识库',desc:'将结果保存到当前项目'}]:[{id:'source',x:5,y:13,kind:'参考资料',icon:'files',title:'设计参考',desc:'AFFiNE · Dify · n8n\n内容工作区与流程编排'},{id:'idea',x:42,y:33,kind:'便签',icon:'sticky-note',title:'工作内容是中心',desc:'对话、文档、画布，围绕同一个项目协作。',note:true},{id:'result',x:67,y:8,kind:'产物',icon:'file-text',title:'竞品分析报告',desc:'从研究材料到可编辑的报告'},{id:'todo',x:10,y:66,kind:'任务',icon:'list-checks',title:'下一轮设计',desc:'确认首页信息层级与项目内导航'}];}
 function renderBoard(flow){const title=flow?'文档审核与入库':'研究思路与资料';main.innerHTML=heading(title,flow?'知识库运营 / 工作流草稿':'产品研究 / 内容画布',button(icon('arrow-left')+' 返回工作台','home'))+`<div class="aw-board-toolbar"><p>${flow?'连接表示执行顺序 · 当前仅展示流程设计':'连接表示资料关系 · 不触发任务执行'}</p>${button(icon('rotate-ccw')+' 重置布局','reset-board')}</div><div class="aw-board" id="aw-board" aria-label="${flow?'工作流':'自由画布'}，节点可拖动或用方向键移动"><svg class="aw-edges" aria-hidden="true"></svg>${boardNodes(flow).map(n=>{const pos=state.nodes[(flow?'f':'b')+n.id]||n;return `<button type="button" class="aw-board-node ${n.note?'aw-note':''}" data-node="${n.id}" style="left:${pos.x}%;top:${pos.y}%" aria-label="${n.title}，按方向键移动" aria-pressed="false"><span class="aw-node-type">${icon(n.icon)}${n.kind}</span><strong>${n.title}</strong><p>${n.desc.replace('\n','<br>')}</p></button>`}).join('')}</div><div class="aw-board-foot"><span>拖动节点调整布局 · 选中后可用方向键微调</span><span>仅保留在本次预览中</span></div><div id="aw-node-detail" class="aw-node-detail" aria-live="polite">${flow?'点击节点查看配置位置。流程编辑与真实执行将分别展示。':'点击资料块查看详情；文档、便签和任务可以共同组织在画布中。'}</div>`;setupBoard(flow);}
 function setupBoard(flow){const board=main.querySelector('#aw-board'),svg=board.querySelector('svg');const edges=flow?[['input','parse'],['parse','review'],['review','output']]:[['source','idea'],['idea','result'],['idea','todo']];function draw(){const r=board.getBoundingClientRect();svg.setAttribute('viewBox',`0 0 ${r.width} ${r.height}`);svg.innerHTML=edges.map(([a,b])=>{const ar=board.querySelector(`[data-node="${a}"]`).getBoundingClientRect(),br=board.querySelector(`[data-node="${b}"]`).getBoundingClientRect();const x1=ar.left-r.left+ar.width/2,y1=ar.top-r.top+ar.height/2,x2=br.left-r.left+br.width/2,y2=br.top-r.top+br.height/2;return `<path d="M${x1},${y1} C${(x1+x2)/2},${y1} ${(x1+x2)/2},${y2} ${x2},${y2}"/>`;}).join('');}
 function select(node){board.querySelectorAll('[data-node]').forEach(n=>n.setAttribute('aria-pressed',String(n===node)));const n=boardNodes(flow).find(n=>n.id===node.dataset.node);main.querySelector('#aw-node-detail').textContent=flow?`${n.title} · 在这里配置输入、处理方式和输出；运行状态会与流程定义分开展示。`:`${n.title} · ${n.kind}。${n.id==='result'?'可从资源列表打开完整文档。':'该内容可作为 AI 协作的引用。'}`;}
 function move(node,x,y){if(board.clientWidth<300)return;const px=Math.max(0,Math.min(board.clientWidth-node.offsetWidth,x)),py=Math.max(0,Math.min(board.clientHeight-node.offsetHeight,y));node.style.left=px/board.clientWidth*100+'%';node.style.top=py/board.clientHeight*100+'%';state.nodes[(flow?'f':'b')+node.dataset.node]={x:px/board.clientWidth*100,y:py/board.clientHeight*100};draw();}
 board.querySelectorAll('[data-node]').forEach(node=>{node.addEventListener('click',()=>select(node));node.addEventListener('pointerdown',e=>{select(node);if(getComputedStyle(node).position!=='absolute')return;const sx=e.clientX,sy=e.clientY,x=node.offsetLeft,y=node.offsetTop;node.setPointerCapture(e.pointerId);const onmove=ev=>move(node,x+ev.clientX-sx,y+ev.clientY-sy);const end=()=>{node.removeEventListener('pointermove',onmove);node.removeEventListener('pointerup',end);node.removeEventListener('pointercancel',end)};node.addEventListener('pointermove',onmove);node.addEventListener('pointerup',end);node.addEventListener('pointercancel',end)});node.addEventListener('keydown',e=>{const d={ArrowLeft:[-10,0],ArrowRight:[10,0],ArrowUp:[0,-10],ArrowDown:[0,10]}[e.key];if(!d||getComputedStyle(node).position!=='absolute')return;e.preventDefault();select(node);move(node,node.offsetLeft+d[0],node.offsetTop+d[1]);});});resizeObserver=new ResizeObserver(draw);resizeObserver.observe(board);requestAnimationFrame(draw);}
 function renderSettings(){main.innerHTML=heading('模型设置','把你使用的模型，接入自己的工作区。',button(icon('arrow-left')+' 返回工作台','home'))+`<div class="aw-settings-grid"><aside class="aw-settings-list"><strong>模型供应商</strong><button type="button" data-provider="compatible" aria-pressed="${state.provider==='compatible'}">OpenAI 兼容接口</button><button type="button" data-provider="dashscope" aria-pressed="${state.provider==='dashscope'}">DashScope</button><button type="button" data-act="add-provider">＋ 添加供应商</button></aside><section class="aw-settings-form"><h2>${state.provider==='compatible'?'OpenAI 兼容接口':'DashScope'}</h2><label class="aw-field">连接地址<input placeholder="正式应用中填写 Base URL" disabled></label><label class="aw-field">API Key<input type="password" placeholder="预览不收集或保存密钥" disabled></label><label class="aw-field">模型<input placeholder="添加模型 ID" disabled></label><div class="aw-project-tabs">${button('测试连接','test-model')}${button('设为默认模型','default-model',true)}</div><p class="aw-settings-note">连接信息在正式应用中配置。此处仅预览布局，不会请求模型服务。</p></section></div>`;}
 function navigate(page){resizeObserver?.disconnect();resizeObserver=undefined;state.page=page;root.querySelector('#aw-crumb').textContent=names[page]||'工作台';root.querySelectorAll('[data-page]').forEach(b=>{if(b.closest('.aw-nav')){if(b.dataset.page===page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');}});if(page==='home')renderHome();else if(['projects','tasks','resources','workflows','canvas'].includes(page))renderCollection(page);else if(page==='project')renderProject();else if(page==='doc')renderDocument();else if(page==='task')renderTask();else if(page==='board'||page==='flow')renderBoard(page==='flow');else if(page==='settings')renderSettings();icons();}
 function openObject(id){const obj=[...state.newTasks,...objects].find(o=>o.id===id);if(!obj)return;if(dialog.open)dialog.close();state.project=obj.project||'research';state.currentTask=obj;const map={doc:'doc',task:'task',canvas:'board',workflow:'flow'};navigate(map[obj.type]);}
 function openDialog(title,body){root.querySelector('#aw-dialog-title').textContent=title;root.querySelector('#aw-dialog-body').innerHTML=body;dialog.showModal();icons();}
 function search(){openDialog('搜索工作区','<input class="aw-search-input" id="aw-search-term" aria-label="搜索关键词" placeholder="搜索项目、任务、文件…"><div id="aw-search-results"></div>');const input=dialog.querySelector('input'),results=dialog.querySelector('#aw-search-results');const fill=()=>{const v=input.value.trim().toLowerCase(),list=[...state.newTasks,...objects].filter(o=>(o.title+o.desc).toLowerCase().includes(v));results.innerHTML=projects.filter(p=>p.name.toLowerCase().includes(v)).map(p=>`<button type="button" class="aw-object-row" data-project="${p.id}">${icon('folder-open')}<span>${esc(p.name)}</span><small>项目</small></button>`).join('')+list.map(row).join('');if(!results.children.length)results.innerHTML='<div class="aw-empty">没有找到相关内容</div>';icons();};input.addEventListener('input',fill);fill();input.focus();}
 function applyDesign(){root.style.setProperty('--aw-sidebar',state.sidebarWidth+'px');root.style.setProperty('--aw-row',state.density==='紧凑'?'10px':'15px');root.style.colorScheme=state.appearance==='system'?'light dark':state.appearance;root.querySelector('#aw-theme-label').textContent={system:'跟随系统',light:'浅色',dark:'深色'}[state.appearance];const section=main.querySelector('#aw-project-section');if(section)section.style.order=state.homeOrder==='任务优先'?'2':'0';}
 function action(act){if(act==='home'){navigate('home');return;}if(act==='close-dialog'){dialog.close();return;}if(act==='search'){search();return;}if(act==='appearance'){state.appearance={system:'dark',dark:'light',light:'system'}[state.appearance];applyDesign();return;}if(act==='sidebar'){root.querySelector('.aw-app').classList.toggle('aw-side-hidden');return;}if(act==='new-task'){navigate('home');main.querySelector('#aw-task-input').focus();return;}if(act==='create-task'){const text=state.draft.trim();if(!text){main.querySelector('#aw-task-input').focus();toast('先描述你想完成的工作。');return;}const p=projects.find(p=>p.id===state.taskProject);const task={id:'draft-'+Date.now(),title:text,type:'task',icon:'list-checks',project:p?.id||'',status:'草稿',tone:'draft',time:'刚刚',desc:'任务 · '+(p?.name||'个人工作区')};state.newTasks.unshift(task);state.draft='';openObject(task.id);return;}if(act==='new-project'){openDialog('新建项目','<label class="aw-field">项目名称<input id="aw-project-name" placeholder="例如：下一季度产品规划" maxlength="60"></label><p class="aw-dialog-hint">项目用于归集任务、资料、画布和成果。此处仅创建本次预览中的示例项目。</p><div class="aw-dialog-actions">'+button('取消','close-dialog')+button('创建项目','save-project',true)+'</div>');return;}if(act==='save-project'){const input=dialog.querySelector('#aw-project-name'),name=input.value.trim();if(!name){input.focus();return;}const p={id:'project-'+Date.now(),name,desc:'你的新项目',icon:'folder-open',count:'暂无任务与资料',recent:'开始第一件工作',time:'刚刚'};projects.push(p);state.project=p.id;dialog.close();navigate('project');return;}if(act==='space'){openDialog('个人工作区','<p class="aw-dialog-hint">当前展示本机个人工作区。后续团队空间将沿用项目、资料和任务结构，并增加成员与访问权限。</p><div class="aw-dialog-actions">'+button('知道了','close-dialog',true)+'</div>');return;}if(act==='attach'){openDialog('添加资料','<p class="aw-dialog-hint">正式应用支持从本机添加文件，或引用项目内已有资料。这里可以选择一份示例文档，预览打开后的工作区。</p><div style="margin-top:18px">'+row(objects[0])+'</div>');return;}if(act==='open-doc'){openObject('report');return;}if(act==='open-board'||act==='new-canvas'){navigate('board');return;}if(act==='open-flow'||act==='new-flow'||act==='weekly'){navigate('flow');if(act==='weekly')toast('当前展示文档流程示例；周报流程的节点可按相同方式编排。');return;}if(act==='reset-board'){state.nodes={};navigate(state.page);return;}if(act==='revise'){state.draft='请优化工作台改造计划：';navigate('home');main.querySelector('#aw-task-input').focus();return;}if(act==='approve-preview'){toast('预览：计划确认后将进入执行状态。当前没有启动真实任务。');return;}if(act==='test-model'||act==='default-model'||act==='add-provider'){toast('这里只预览模型配置交互，不保存密钥或调用模型。');}}
 root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!root.contains(b))return;if(b.dataset.act)action(b.dataset.act);else if(b.dataset.page)navigate(b.dataset.page);else if(b.dataset.project){if(dialog.open)dialog.close();state.project=b.dataset.project;navigate('project');}else if(b.dataset.object)openObject(b.dataset.object);else if(b.dataset.filter){state.filter=b.dataset.filter;main.querySelectorAll('[data-filter]').forEach(t=>t.setAttribute('aria-pressed',String(t===b)));renderRecent();}else if(b.dataset.provider){state.provider=b.dataset.provider;renderSettings();icons();}else if(b.dataset.ai){const target=main.querySelector('#aw-ai-response');target.innerHTML='<p>'+ (b.dataset.ai==='summary'?'示例建议：以项目组织资料、任务和产物，中央工作区根据内容切换视图。':'示例建议：先确认首页与项目导航，再验证文档、画布和流程的打开方式。')+'</p><small>预设示例，未调用模型</small>';}});
 root.addEventListener('input',e=>{if(e.target.id==='aw-task-input')state.draft=e.target.value;});root.addEventListener('change',e=>{if(e.target.id==='aw-task-project')state.taskProject=e.target.value;});root.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(!dialog.open)search();}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='n'){e.preventDefault();if(dialog.open)dialog.close();action('new-task');}});
 navigate('home');applyDesign();
 if(globalThis.Tweak){const t=new Tweak({container:root,onChange:applyDesign});t.addSelect(state,'appearance',{label:'外观',options:[{label:'跟随系统',value:'system'},{label:'浅色',value:'light'},{label:'深色',value:'dark'}]});t.addSelect(state,'homeOrder',{label:'首页优先级',options:['项目优先','任务优先']});t.addSelect(state,'density',{label:'列表密度',options:['舒展','紧凑']});t.addSlider(state,'sidebarWidth',{label:'侧栏宽度',min:180,max:230,step:10,unit:'px'});}
})();
</script>
