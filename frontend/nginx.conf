server {
    listen       80;
    server_name  localhost;
    
    # 前端静态文件根目录
    root   /usr/share/nginx/html;

    # 所有HTML请求都返回index.html（解决Vue路由的404问题）
    location / {
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
        # SPA 入口不允许强缓存：部署后必须重新校验，避免旧 index.html 引用已删除的资源
        add_header Cache-Control "no-cache";
    }

    # 显式入口路径同样 no-cache（优先于下方静态资源正则）
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

        # ------------------------------------------------------------------
        # 独立中台服务（同域前缀路由）：评测中台 / 数据中台各自独立镜像与页面。
        # 注意 ^~ 最长前缀匹配优先于下方 /api/，不会落到主后端。
        # ------------------------------------------------------------------
        # 使用变量 + Docker DNS：中台服务未启动时 nginx 仍可正常启动；
        # resolver 复用文件末尾（同一 server 块只能有一条 resolver 指令）
        set $eval_upstream eval-service:8140;
        set $data_upstream data-service:8141;

        location ^~ /api/ai/eval/ {
            proxy_pass http://$eval_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_read_timeout 900s;   # TASK 评测同步执行可能较长
        }

        location ^~ /api/ai/feedback {
            proxy_pass http://$data_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ^~ /eval/ {
            proxy_pass http://$eval_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ^~ /data/ {
            proxy_pass http://$data_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Docker Compose 内部通过服务名访问后端，保留 /api 前缀。
        location ^~ /api/ {
            proxy_pass http://backend:8123;
        
        # 设置请求头
            proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 修复SSE (Server-Sent Events)配置
        proxy_set_header Connection ""; # 保持连接打开
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 600s;
        
        # 增加错误调试信息
        proxy_intercept_errors off;
    }

    # 网页截图 MCP 的短时图片资源（仅代理截图目录，不暴露 MCP SSE）
    # 使用变量 + Docker DNS，browser-mcp 未启动时 Nginx 仍可正常启动。
    resolver 127.0.0.11 valid=30s;
    set $browser_mcp_upstream browser-mcp:8129;
    location ^~ /screenshots/ {
        proxy_pass http://$browser_mcp_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        expires 10m;
        add_header Cache-Control "public";
    }

    # 图标：文件名不随内容变化，不能沿用下方静态资源的一年强缓存，
    # 否则更换产品标识后浏览器标签页会长期显示旧图标。
    location ~* ^/(favicon\.svg|apple-touch-icon\.png)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        access_log off;
    }

    # 处理静态资源请求
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public";
    }

    # 处理错误页
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
