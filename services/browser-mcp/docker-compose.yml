name: zwx-browser-mcp

services:
  browser-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: zwx-browser-mcp-server:local
    container_name: zwx-browser-mcp-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:8129:8129"
    environment:
      PORT: 8129
      SCREENSHOT_DIR: /app/screenshots
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:8129}
      BROWSER_ALLOW_PRIVATE_HOSTS: ${BROWSER_ALLOW_PRIVATE_HOSTS:-false}
      BROWSER_ALLOWED_HOSTS: ${BROWSER_ALLOWED_HOSTS:-*}
      SCREENSHOT_TTL_MS: ${SCREENSHOT_TTL_MS:-1800000}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8129/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - ./screenshots:/app/screenshots
