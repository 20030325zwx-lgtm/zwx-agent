name: zwx-document-mcp

services:
  document-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: zwx-document-mcp-server:local
    container_name: zwx-document-mcp-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:8128:8128"
    environment:
      DOCUMENT_PROVIDER: ${DOCUMENT_PROVIDER:-mineru}
      DOCUMENT_FALLBACK_TO_DOCLING: ${DOCUMENT_FALLBACK_TO_DOCLING:-true}
      MINERU_TOKEN: ${MINERU_TOKEN:-}
      MINERU_MODEL_VERSION: ${MINERU_MODEL_VERSION:-vlm}
      MINERU_LANGUAGE: ${MINERU_LANGUAGE:-ch}
      MINERU_TIMEOUT_SECONDS: ${MINERU_TIMEOUT_SECONDS:-600}
      DOCLING_ENABLED: ${DOCLING_ENABLED:-false}
      DOCLING_BASE_URL: ${DOCLING_BASE_URL:-http://host.docker.internal:5001}
      TIKA_BASE_URL: ${TIKA_BASE_URL:-}
      DOCUMENT_ALLOWED_HOSTS: ${DOCUMENT_ALLOWED_HOSTS:-*.aliyuncs.com,localhost,127.0.0.1}
      DOCUMENT_MAX_BYTES: ${DOCUMENT_MAX_BYTES:-20971520}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8128/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
