name: zwx-image-mcp

services:
  image-search-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: zwx-image-search-mcp-server:local
    container_name: zwx-image-search-mcp-server
    restart: unless-stopped
    ports:
      # 默认只绑定本机，避免无鉴权的 MCP 服务暴露到局域网/公网。
      - "127.0.0.1:8127:8127"
    environment:
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_VISION_MODEL: ${DASHSCOPE_VISION_MODEL:-qwen3-vl-plus}
      IMAGE_ALLOWED_HOSTS: ${IMAGE_ALLOWED_HOSTS:-*.aliyuncs.com,localhost,127.0.0.1}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8127/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
