spring:
  application:
    name: zwx-agent
  profiles:
    default: local
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
# 临时注释掉，便于大家开发调试和部署（实际填写 PgVector 数据库信息）
#  datasource:
#    url: xxx
#    username: root
#    password: 123456
  ai:
    dashscope:
      # 需要替换为你自己的 key
      api-key: your-api-key
      chat:
        options:
          model: qwen-plus
    ollama:
      base-url: http://localhost:11434
      chat:
        model: gemma3:1b
# 临时注释掉，便于大家开发调试和部署（实际需要启动 MCP 服务）
#    mcp:
#      client:
#        sse:
#          connections:
#            server1:
#              url: http://localhost:8127
#        stdio:
#          servers-configuration: classpath:mcp-servers.json
# 临时注释掉，便于大家开发调试和部署（实际需要启动 PgVector 数据库）
#    vectorstore:
#      pgvector:
#        index-type: HNSW
#        dimensions: 1536
#        distance-type: COSINE_DISTANCE
#        max-document-batch-size: 10000 # Optional: Maximum number of documents per batch
server:
  port: 8123
  servlet:
    context-path: /api
  max-http-request-header-size: 16KB
spring.servlet.multipart:
  max-file-size: 10MB
  max-request-size: 10MB
app:
  security:
    jwt-secret: ${JWT_SECRET:zwx-agent-dev-jwt-secret-change-me-0123456789abcdef}
    jwt-ttl-hours: ${JWT_TTL_HOURS:72}
    admin-username: ${APP_SECURITY_ADMIN_USERNAME:admin}
    admin-password: ${APP_SECURITY_ADMIN_PASSWORD:}
  temp-dir: ${APP_TEMP_DIR:${user.dir}/temp}
  workspace:
    # 统一工作区根（design/plans/09 批次 A）；空 = {temp-dir}/workspaces
    root: ${APP_WORKSPACE_ROOT:}
  skills:
    # markdown 技能目录（批次 B，相对后端工作目录）；目录为空或解析失败时回落内置 web-research
    dir: ${APP_SKILLS_DIR:skills}
  love:
    vision-model: qwen-vl-plus
    rag:
      top-k: 3
      similarity-threshold: 0.55
      # 重排启用后预算放宽：召回 + 重排 + 兜底余量
      timeout-ms: 2500
      # 扩大召回池：放宽阈值召回更多候选，交给 rerank 精排
      recall-top-k: 15
      recall-similarity-threshold: 0.4
  agent:
    rag:
      top-k: 3
      similarity-threshold: 0.55
      timeout-ms: 3000
      recall-top-k: 15
      recall-similarity-threshold: 0.4
    hook:
      # 工具结果截断阈值（字符）
      tool-result-max-chars: 8000
    memory:
      # 工作记忆压缩（批次 C L1）：messageList 超 context-budget 字符时压缩最旧块，保留最近 recent-keep 条
      compression-enabled: true
      context-budget: 24000
      recent-keep: 6
      # 长期事实提取（批次 C L3）：LLM 成本考虑默认关
      extraction-enabled: false
  rag:
    rerank:
      # 总开关：false 或未配置 DashScope api-key 时自动降级为向量原始顺序
      enabled: true
      model: gte-rerank-v2
      timeout-ms: 1200
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:}
    access-key: ${MINIO_ROOT_USER:}
    secret-key: ${MINIO_ROOT_PASSWORD:}
    bucket: ${MINIO_BUCKET:love-chat-images}
  oss:
    endpoint: ${ALIYUN_OSS_ENDPOINT:https://oss-cn-hangzhou.aliyuncs.com}
    bucket: ${ALIYUN_OSS_BUCKET:zwx-agent}
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
  document-parser:
    tika:
      # Optional Apache Tika Server endpoint, for example http://127.0.0.1:9998
      base-url: ${APP_TIKA_BASE_URL:}
# springdoc-openapi config
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.zwx.zwxagent.controller
# knife4j config
knife4j:
  enable: true
  setting:
    language: zh_cn
search-api:
  # Supported providers: searchapi, tavily
  provider: ${SEARCH_API_PROVIDER:searchapi}
  api-key: ${SEARCH_API_API_KEY:}
# 生产环境由 application-prod.yml 收敛日志与 API 文档；本地默认仅 INFO
logging:
  level:
    org.springframework.ai: INFO
